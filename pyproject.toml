[project]
name = "ecomevo-harness"
version = "1.0.0"
description = "E-commerce autonomous decision runtime with event sourcing, adaptive planning, multimodal evidence, verification, rollback and controlled evolution."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10,<12",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ecomevo = "ecomevo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
