name: Empty Routing Serial Semantics Probe

on:
  pull_request:
    paths:
      - 'scripts/empty_routing_serial_semantics_probe.py'
      - '.github/workflows/empty-routing-serial-semantics.yml'
      - 'ecomevo/runtime/**'
      - 'ecomevo/models.py'

permissions:
  contents: read

jobs:
  empty-routing-serial-semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Verify serial empty-rank semantics
        run: python scripts/empty_routing_serial_semantics_probe.py
