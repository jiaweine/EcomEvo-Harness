name: Evolution Patch Positive Cache Gate

on:
  pull_request:
    paths:
      - 'ecomevo/runtime/bundled_event_store.py'
      - 'tests/test_evolution_patch_positive_cache.py'
      - 'tests/test_evolution_patch_read_fastpath.py'
      - 'scripts/evolution_patch_positive_cache_gate.py'
      - '.github/workflows/evolution-patch-positive-cache.yml'

permissions:
  contents: read

jobs:
  evolution-patch-positive-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Evolution patch cache semantics
        run: |
          pytest -q \
            tests/test_evolution_patch_positive_cache.py \
            tests/test_evolution_patch_read_fastpath.py
      - name: Evolution patch cache A/B
        run: python scripts/evolution_patch_positive_cache_gate.py
