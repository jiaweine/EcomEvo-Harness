name: Publish EcomEvo source

on:
  push:
    branches: [release-product-ui]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part_* > /tmp/update.b64
          base64 -d /tmp/update.b64 > /tmp/update.patch.xz
          echo "8a9225f248fcc84bebc901e18e748311a62955a1bf85c12fbb22b53bca42dda6  /tmp/update.patch.xz" | sha256sum -c -
          xz -t /tmp/update.patch.xz
          xz -dc /tmp/update.patch.xz > /tmp/update.patch
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          rm -rf .transfer
          rm -f .github/workflows/publish-ecomevo.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          ACTUAL="$(git write-tree)"
          EXPECTED="6ada1c09166d0f475233e9f5033a1a42071fe672"
          test "$ACTUAL" = "$EXPECTED" || { echo "tree mismatch: $ACTUAL"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish EcomEvo product workspace"
          git push origin HEAD:release-product-ui
