name: Decision Static Term Cache Gate

on:
  pull_request:
    paths:
      - ecomevo/runtime/precomputed_ranking.py
      - tests/test_precomputed_static_term_cache.py
      - scripts/decision_static_term_cache_gate.py
      - .github/workflows/decision-static-term-cache-gate.yml

permissions:
  contents: read

jobs:
  decision-static-term-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Static term cache semantic boundaries
        run: python -m pytest -q tests/test_precomputed_static_term_cache.py
      - name: Fixed-input production A/B
        run: python scripts/decision_static_term_cache_gate.py
