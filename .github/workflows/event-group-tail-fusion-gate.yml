name: Event Group Tail Fusion Gate

on:
  pull_request:
    paths:
      - ecomevo/runtime/bundled_event_store.py
      - tests/test_event_group_tail_fusion.py
      - scripts/event_group_tail_fusion_gate.py
      - .github/workflows/event-group-tail-fusion-gate.yml

permissions:
  contents: read

jobs:
  event-group-tail-fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Lock event tail fusion semantics
        run: python -m pytest -q tests/test_event_group_tail_fusion.py
      - name: Fixed-input event tail fusion A/B
        run: python scripts/event_group_tail_fusion_gate.py
