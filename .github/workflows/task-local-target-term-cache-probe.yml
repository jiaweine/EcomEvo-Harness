name: Task-local Target Term Cache Probe

on:
  pull_request:
    paths:
      - 'scripts/task_local_target_term_cache_probe.py'
      - '.github/workflows/task-local-target-term-cache-probe.yml'
      - 'ecomevo/runtime/control_policy.py'
      - 'ecomevo/runtime/precomputed_ranking.py'
      - 'ecomevo/runtime/counterfactual_routing.py'
      - 'ecomevo/runtime/planner.py'

permissions:
  contents: read

jobs:
  task-local-target-term-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Measure task-local target term reuse
        run: python scripts/task_local_target_term_cache_probe.py
