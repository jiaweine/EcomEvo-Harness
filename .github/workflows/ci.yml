name: EcomEvo CI

on:
  pull_request:
  push:
    branches:
      - agent/autonomous-self-evolving-runtime

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Python compile
        run: python -m compileall -q ecomevo
      - name: Tests
        run: pytest -q
      - name: Frontend syntax
        run: |
          node --check frontend/enhancements.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          HTMLParser().feed(Path('frontend/index.html').read_text())
          css = Path('frontend/product-polish.css').read_text()
          assert css.count('{') == css.count('}'), 'unbalanced product-polish.css'
          print('frontend static checks ok')
          PY
