name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Python tests
        run: pytest -q
      - name: Frontend syntax checks
        run: |
          node --check frontend/app.js
          node --check frontend/intro.js
      - name: Product smoke
        run: python scripts/e2e_smoke.py

  capture-readme-gallery:
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/real-product-gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and Chromium
        run: |
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start current EcomEvo
        run: |
          export ECOMEVO_DATA="$RUNNER_TEMP/ecomevo-gallery"
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/ecomevo-gallery.log" 2>&1 &
      - name: Capture desktop and mobile README gallery
        run: python scripts/capture_readme_gallery.py
      - name: Upload verified gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-real-gallery
          path: docs/images/real/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/ecomevo-gallery.log" || true
