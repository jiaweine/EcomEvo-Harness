name: EcomEvo CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecomevo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: '26.2.1'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: System media dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[dev]'
      - name: Python compile
        run: python -m compileall -q ecomevo
      - name: Tests
        run: pytest -q
      - name: Gold Set promotion gate
        run: python scripts/eval_gate.py
      - name: Frontend syntax
        run: |
          for file in frontend/*.js; do
            node --check "$file"
          done
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          frontend = Path('frontend')
          html = (frontend / 'index.html').read_text(encoding='utf-8')
          HTMLParser().feed(html)
          assert html.count('id="') == len({part.split('"', 1)[0] for part in html.split('id="')[1:]}), 'duplicate DOM id'
          scripts = re.findall(r'<script\b[^>]*\bsrc="/assets/([A-Za-z0-9._-]+\.js)"[^>]*>', html)
          expected_scripts = [
              'safety-guards.js',
              'privacy-sanitize.js',
              'drawer-a11y.js',
              'enhancements-core.js',
              'ops-intelligence.js',
              'plugin-control.js',
              'customer-copy.js',
              'customer-dynamic-copy.js',
              'customer-polish.js',
              'provider-marketplace.js',
              'realtime-reconcile.js',
              'app.js',
              'intro.js',
          ]
          assert scripts == expected_scripts, f'unexpected frontend bootstrap order: {scripts}'
          for script in scripts:
              assert (frontend / script).is_file(), f'missing static script: {script}'
          assert not (frontend / 'enhancements.js').exists(), 'legacy dynamic enhancement loader must stay removed'
          for css_path in ('frontend/visual.css', 'frontend/product-polish.css', 'frontend/intro.css', 'frontend/lifecycle.css', 'frontend/provider-marketplace.css'):
              css = Path(css_path).read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'unbalanced {css_path}'
          print('frontend static checks ok')
          PY
      - name: Product smoke
        run: python scripts/e2e_smoke.py

  compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: System media dependency
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[dev]'
      - name: Compile and test latest supported Python
        run: |
          python -m compileall -q ecomevo
          pytest -q
          python scripts/e2e_smoke.py

  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e .
      - name: Bootstrap persistence A/B gate
        run: python scripts/bootstrap_pressure_gate.py
      - name: Current-head concurrency gate
        run: python scripts/pressure_gate.py

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and browser harness
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[e2e]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser interaction gate
        env:
          ECOMEVO_DATA: ${{ runner.temp }}/ecomevo-e2e
          ECOMEVO_AUTH_MODE: local
          ECOMEVO_LOCAL_ROLE: admin
          ECOMEVO_E2E_ARTIFACT_DIR: outputs/e2e
        run: |
          set -euo pipefail
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > /tmp/ecomevo-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python scripts/browser_e2e.py; then
            sed -n '1,240p' /tmp/ecomevo-e2e.log
            exit 1
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecomevo-browser-e2e
          path: outputs/e2e
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install security gates
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[security]'
      - name: Dependency vulnerability gate
        run: pip-audit --strict --progress-spinner off .
      - name: Python security static gate
        run: bandit -q -r ecomevo -ll

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel in a clean environment
        run: |
          wheel_env="${RUNNER_TEMP}/ecomevo-wheel"
          python -m venv "$wheel_env"
          "$wheel_env/bin/python" -m pip install --upgrade "pip==${PIP_VERSION}"
          "$wheel_env/bin/python" -m pip install dist/ecomevo_harness-*.whl
          ECOMEVO_DATA="${RUNNER_TEMP}/ecomevo-wheel-data" \
            "$wheel_env/bin/ecomevo" --host 127.0.0.1 --port 8766 > "${RUNNER_TEMP}/ecomevo-wheel.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8766/healthz >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              sed -n '1,240p' "${RUNNER_TEMP}/ecomevo-wheel.log"
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/ >/dev/null
          curl -fsS http://127.0.0.1:8766/assets/app.js >/dev/null
          "$wheel_env/bin/python" - <<'PY'
          from importlib.resources import files
          from PIL import __version__ as pillow_version

          assert files("frontend").joinpath("index.html").is_file()
          assert tuple(int(part) for part in pillow_version.split(".")[:3]) >= (12, 3, 0)
          print("wheel runtime smoke ok")
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --tag ecomevo:ci .
      - name: Verify non-root read-only runtime
        run: |
          test "$(docker image inspect ecomevo:ci --format '{{.Config.User}}')" = "10001:10001"
          container_id=$(docker run --detach --read-only \
            --tmpfs /tmp:mode=1777 \
            --tmpfs /app/outputs:uid=10001,gid=10001,mode=0700 \
            --publish 8767:8000 ecomevo:ci)
          trap 'docker logs "$container_id" 2>/dev/null || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:8767/healthz >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 45 ]]; then
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8767/ >/dev/null
          curl -fsS http://127.0.0.1:8767/assets/app.js >/dev/null
