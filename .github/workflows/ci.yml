name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Python tests
        run: pytest -q
      - name: Frontend syntax checks
        run: |
          node --check frontend/app.js
          node --check frontend/intro.js
      - name: Product smoke
        run: python scripts/e2e_smoke.py

  capture-readme-gallery:
    if: github.event_name == 'pull_request' && github.head_ref == 'docs/real-product-gallery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/real-product-gallery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and Chromium
        run: |
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start current EcomEvo
        run: |
          export ECOMEVO_DATA="$RUNNER_TEMP/ecomevo-gallery"
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/ecomevo-gallery.log" 2>&1 &
      - name: Capture desktop and mobile README gallery
        run: python scripts/capture_readme_gallery.py
      - name: Publish verified captures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/images/real/*.png
          if git diff --cached --quiet; then
            echo "Gallery is already current"
          else
            git commit -m "Refresh real README product gallery [skip ci]"
            git push origin HEAD:docs/real-product-gallery
          fi
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/ecomevo-gallery.log" || true
