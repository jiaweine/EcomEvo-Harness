name: Fix Event Tail Fusion Indentation

on:
  push:
    branches:
      - perf/event-group-tail-fusion-stacked
    paths:
      - .github/workflows/fix-event-tail-fusion-indentation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore class indentation and validate syntax
        run: |
          python - <<'PY'
          import base64
          import textwrap
          from pathlib import Path

          path = Path('ecomevo/runtime/bundled_event_store.py')
          text = path.read_text()
          start_marker = '    @staticmethod\ndef _session_tails_for_append_group(\n'
          end_marker = '\n    def _persist_bootstrap_group(\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          encoded = ''
          block = base64.b64decode(encoded).decode()
          replacement = textwrap.indent(block, '    ')
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python -m py_compile ecomevo/runtime/bundled_event_store.py
          git diff --check
          git diff -- ecomevo/runtime/bundled_event_store.py
      - name: Commit indentation repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecomevo/runtime/bundled_event_store.py
          git commit -m 'fix(runtime): restore event tail fusion class scope'
          git push origin HEAD:perf/event-group-tail-fusion-stacked
