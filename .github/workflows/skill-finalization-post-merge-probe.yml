name: Skill Post-merge Attribution Probe

on:
  pull_request:
    paths:
      - 'scripts/skill_finalization_post_merge_probe.py'
      - '.github/workflows/skill-finalization-post-merge-probe.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Lock existing semantics
        run: pytest -q tests/test_skill_async_offload.py tests/test_skill_note_run_group_commit.py
      - name: Fixed six-order 64 and 256 call attribution
        run: python scripts/skill_finalization_post_merge_probe.py
