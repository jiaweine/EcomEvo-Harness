name: Apply Evolution Patch Positive Cache

on:
  push:
    branches:
      - perf/evolution-patch-positive-cache-stacked
    paths:
      - 'scripts/apply_evolution_patch_positive_cache.py'
      - '.github/workflows/apply-evolution-patch-positive-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/evolution-patch-positive-cache-stacked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact patch
        run: |
          python scripts/apply_evolution_patch_positive_cache.py
          python -m py_compile ecomevo/runtime/bundled_event_store.py
          git diff --check
      - name: Commit runtime patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ecomevo/runtime/bundled_event_store.py
          git diff --cached --quiet && exit 0
          git commit -m 'perf(event-store): cache confirmed evolution patches'
          git push origin HEAD:perf/evolution-patch-positive-cache-stacked
