name: README Real Gallery Capture

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/capture_readme_gallery.py
      - .github/workflows/readme-gallery-capture.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/real-product-gallery

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install app and browser tooling
        run: |
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start current product
        run: |
          export ECOMEVO_DATA="$RUNNER_TEMP/ecomevo-gallery"
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/ecomevo-gallery.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ecomevo-gallery.pid"

      - name: Capture real desktop and mobile product states
        run: python scripts/capture_readme_gallery.py

      - name: Publish generated PNGs to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/images/real/*.png
          if git diff --cached --quiet; then
            echo "Gallery is already current"
          else
            git commit -m "Refresh real README product gallery [skip ci]"
            git push origin HEAD:docs/real-product-gallery
          fi

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/ecomevo-gallery.log" || true
