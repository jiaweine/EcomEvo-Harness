name: Post-Factor Decision Profile

on:
  pull_request:
    paths:
      - "scripts/post_factor_decision_profile.py"
      - "scripts/decision_read_fusion_probe.py"
      - ".github/workflows/post-factor-decision-profile.yml"

permissions:
  contents: read

jobs:
  post-factor-decision-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e .
      - name: Post-factor decision leaf profile
        run: python scripts/post_factor_decision_profile.py --tasks 120
      - name: Decision read fusion probe
        run: python scripts/decision_read_fusion_probe.py
