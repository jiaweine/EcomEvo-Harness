name: Refresh README Gallery

on:
  push:
    branches: [perf/static-customer-theme]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and browser harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[e2e]'
          python -m playwright install --with-deps chromium
      - name: Capture current product
        env:
          ECOMEVO_DATA: ${{ runner.temp }}/ecomevo-readme-gallery
          ECOMEVO_AUTH_MODE: local
          ECOMEVO_LOCAL_ROLE: admin
          ECOMEVO_E2E_ARTIFACT_DIR: outputs/readme-gallery
        run: |
          set -euo pipefail
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > /tmp/ecomevo-gallery.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python scripts/browser_e2e.py; then
            sed -n '1,240p' /tmp/ecomevo-gallery.log
            exit 1
          fi
          test -s outputs/readme-gallery/product-overview.png
          test -s outputs/readme-gallery/product-evidence.png
          test -s outputs/readme-gallery/product-mobile.png
      - name: Publish ultra-high-resolution README captures
        run: |
          cp outputs/readme-gallery/product-overview.png docs/images/product-customer-overview.png
          cp outputs/readme-gallery/product-evidence.png docs/images/product-customer-evidence.png
          cp outputs/readme-gallery/product-mobile.png docs/images/product-customer-mobile.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = {
              'product-customer-overview.png': (3840, 2400),
              'product-customer-evidence.png': (3840, 2400),
              'product-customer-mobile.png': (780, 1688),
          }
          for name, size in expected.items():
              path = Path('docs/images') / name
              assert Image.open(path).size == size, (name, Image.open(path).size)
              print(name, size, path.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/product-customer-overview.png docs/images/product-customer-evidence.png docs/images/product-customer-mobile.png
          if git diff --cached --quiet; then
            echo 'Gallery already current'
            exit 0
          fi
          git commit -m 'docs(gallery): refresh ultra-high-resolution product captures'
          git push origin HEAD:perf/static-customer-theme
