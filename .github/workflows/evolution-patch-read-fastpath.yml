name: Evolution Patch Read Fast-path Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecomevo-evolution-patch-fastpath-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: '26.2.1'

jobs:
  evolution-patch-read-fastpath:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[dev]'
      - name: Evolution patch duplicate read fast-path A/B
        run: python scripts/evolution_patch_read_fastpath_gate.py
      - name: Evolution patch fast-path semantics
        run: pytest -q tests/test_evolution_patch_read_fastpath.py
