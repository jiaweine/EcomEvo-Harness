name: Routing Summary Read Probe

on:
  pull_request:
    paths:
      - scripts/routing_summary_read_probe.py
      - .github/workflows/routing-summary-read-probe.yml

permissions:
  contents: read

jobs:
  routing-summary-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Measure compact routing summary read
        run: python scripts/routing_summary_read_probe.py
