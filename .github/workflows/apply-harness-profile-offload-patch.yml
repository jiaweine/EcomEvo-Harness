name: Apply Harness Profile Offload Patch

on:
  push:
    branches:
      - perf/harness-profile-offload-stacked
    paths:
      - 'scripts/apply_harness_profile_offload_patch.py'
      - '.github/workflows/apply-harness-profile-offload-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/harness-profile-offload-stacked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact patch
        run: |
          python scripts/apply_harness_profile_offload_patch.py
          python -m py_compile ecomevo/runtime/bundled_harness_optimizer.py ecomevo/runtime/engine.py
          git diff --check
      - name: Commit runtime patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ecomevo/runtime/bundled_harness_optimizer.py ecomevo/runtime/engine.py
          git diff --cached --quiet && exit 0
          git commit -m 'perf(harness): offload startup profile read'
          git push origin HEAD:perf/harness-profile-offload-stacked
