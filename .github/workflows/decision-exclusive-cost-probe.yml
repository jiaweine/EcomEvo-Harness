name: Decision Exclusive Cost Probe

on:
  pull_request:
    paths:
      - 'scripts/decision_exclusive_cost_probe.py'
      - '.github/workflows/decision-exclusive-cost-probe.yml'
      - 'ecomevo/runtime/**'

permissions:
  contents: read

jobs:
  decision-exclusive-cost:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Decompose decision policy cost
        run: python scripts/decision_exclusive_cost_probe.py
