name: Task-local Target Term Cache Gate

on:
  pull_request:
    paths:
      - 'ecomevo/runtime/counterfactual_routing.py'
      - 'tests/test_task_local_target_terms.py'
      - 'scripts/task_local_target_term_cache_gate.py'
      - '.github/workflows/task-local-target-term-cache-gate.yml'

permissions:
  contents: read

jobs:
  task-local-target-term-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e . pytest
      - name: Task-local cache semantic boundaries
        run: pytest -q tests/test_task_local_target_terms.py
      - name: Fixed-input production A/B
        run: python scripts/task_local_target_term_cache_gate.py
