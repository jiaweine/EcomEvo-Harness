name: Planner Input Reuse Probe

on:
  pull_request:
    paths:
      - scripts/planner_input_reuse_probe.py
      - .github/workflows/planner-input-reuse-probe.yml

permissions:
  contents: read

jobs:
  planner-input-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Measure planner semantic-input reuse
        run: python scripts/planner_input_reuse_probe.py
