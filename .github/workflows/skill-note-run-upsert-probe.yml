name: Skill Note Run UPSERT Probe

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecomevo-skill-note-run-upsert-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_VERSION: '26.2.1'

jobs:
  skill-note-run-upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==${PIP_VERSION}"
          python -m pip install -e '.[dev]'
      - name: Skill learning note-run UPSERT A/B
        run: python scripts/skill_note_run_upsert_probe.py
      - name: Runtime skill note-run writer-hold A/B
        run: python scripts/skill_note_run_runtime_upsert_probe.py
