name: Finalize verified EcomEvo import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-import.yml'

permissions:
  contents: write

concurrency:
  group: finalize-ecomevo-release
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified release and enforce exact Git tree
        shell: bash
        run: |
          set -euo pipefail
          cp .gitignore /tmp/ecomevo.gitignore
          cat .bootstrap/chunk_* | tr -d '[:space:]' | base64 -d > /tmp/ecomevo.zip
          unzip -t /tmp/ecomevo.zip >/dev/null
          rm -rf /tmp/ecomevo-release
          mkdir -p /tmp/ecomevo-release
          unzip -q /tmp/ecomevo.zip -d /tmp/ecomevo-release
          readme="$(find /tmp/ecomevo-release -type f -name README.md -print -quit)"
          test -n "$readme"
          src="$(dirname "$readme")"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          cp /tmp/ecomevo.gitignore .gitignore
          rm -rf outputs .bootstrap .payload .transfer .transfer4 .github
          rm -f .env
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git add -A
          tree="$(git write-tree)"
          echo "Verified tree: $tree"
          test "$tree" = "80ffb2a455d945981a4ee484c7a1197d809530ce"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import verified EcomEvo release"
          git push origin HEAD:main
