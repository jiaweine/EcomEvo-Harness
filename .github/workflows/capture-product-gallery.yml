name: Capture Product Gallery

on:
  push:
    branches:
      - design/obsidian-porcelain-ui

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[gallery-captured]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install browser harness
        run: |
          python -m pip install -e '.[e2e]'
          python -m playwright install --with-deps chromium
      - name: Capture current product
        env:
          ECOMEVO_DATA: ${{ runner.temp }}/ecomevo-gallery
          ECOMEVO_AUTH_MODE: local
          ECOMEVO_LOCAL_ROLE: admin
          ECOMEVO_E2E_ARTIFACT_DIR: outputs/e2e
        run: |
          set -euo pipefail
          uvicorn ecomevo.api.app:app --host 127.0.0.1 --port 8765 > /tmp/ecomevo-gallery.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python scripts/browser_e2e.py; then
            sed -n '1,240p' /tmp/ecomevo-gallery.log
            exit 1
          fi
      - name: Refresh README gallery originals
        run: |
          set -euo pipefail
          cp outputs/e2e/product-overview.png docs/images/product-customer-overview.png
          cp outputs/e2e/product-evidence.png docs/images/product-customer-evidence.png
          cp outputs/e2e/product-mobile.png docs/images/product-customer-mobile.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/images/product-customer-overview.png docs/images/product-customer-evidence.png docs/images/product-customer-mobile.png
          if git diff --cached --quiet; then
            echo 'Gallery already current.'
            exit 0
          fi
          git commit -m 'docs(ui): refresh product gallery [gallery-captured]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload final gallery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecomevo-product-gallery
          path: outputs/e2e
          if-no-files-found: ignore
