name: Ranking Feature Precompute Gate

on:
  pull_request:
    paths:
      - "ecomevo/runtime/precomputed_ranking.py"
      - "ecomevo/runtime/counterfactual_routing.py"
      - "tests/test_precomputed_ranking.py"
      - "scripts/ranking_feature_gate.py"
      - ".github/workflows/ranking-feature.yml"

permissions:
  contents: read

jobs:
  ranking-feature:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e . pytest
      - name: Ranking feature correctness
        run: python -m pytest tests/test_precomputed_ranking.py tests/test_decision_round_context.py tests/test_factorized_routing.py -q
      - name: Ranking feature A/B
        run: python scripts/ranking_feature_gate.py --iterations 2500 --experiments 5
