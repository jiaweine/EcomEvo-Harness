name: Decision Read Fusion Gate

on:
  pull_request:
    paths:
      - "ecomevo/runtime/bundled_skills.py"
      - "ecomevo/runtime/factorized_routing.py"
      - "ecomevo/runtime/counterfactual_routing.py"
      - "tests/test_fused_decision_read.py"
      - "scripts/decision_read_fusion_gate.py"
      - ".github/workflows/decision-read-fusion.yml"

permissions:
  contents: read

jobs:
  decision-read-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install -e . pytest
      - name: Fused read correctness
        run: python -m pytest tests/test_fused_decision_read.py tests/test_decision_round_context.py tests/test_skill_read_snapshot.py tests/test_factorized_routing.py -q
      - name: Production decision read A/B
        run: python scripts/decision_read_fusion_gate.py --iterations 600 --experiments 5
