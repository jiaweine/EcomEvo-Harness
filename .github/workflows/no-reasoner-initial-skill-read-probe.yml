name: No-reasoner Initial Skill Read Probe

on:
  pull_request:
    paths:
      - 'scripts/no_reasoner_initial_skill_read_probe.py'
      - '.github/workflows/no-reasoner-initial-skill-read-probe.yml'
      - 'ecomevo/runtime/skills.py'
      - 'ecomevo/runtime/bundled_skills.py'
      - 'ecomevo/runtime/counterfactual_routing.py'

permissions:
  contents: read

jobs:
  no-reasoner-initial-skill-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Measure no-reasoner initial skill-only read
        run: python scripts/no_reasoner_initial_skill_read_probe.py
