name: Harness Profile Offload Probe

on:
  pull_request:
    paths:
      - 'scripts/harness_profile_offload_probe.py'
      - '.github/workflows/harness-profile-offload-probe.yml'
      - 'ecomevo/runtime/bundled_harness_optimizer.py'
      - 'ecomevo/runtime/engine.py'

permissions:
  contents: read

jobs:
  harness-profile-offload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Measure Harness profile offload
        run: python scripts/harness_profile_offload_probe.py
