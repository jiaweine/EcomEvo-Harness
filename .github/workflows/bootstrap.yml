name: Bootstrap verified source

on:
  push:
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified project
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part_* | base64 -d > /tmp/ecomevo.zip
          echo "ef791391f26a06f999c17827a05d46ccdba3ce1466a6cf55acc2107ce48c44bf  /tmp/ecomevo.zip" | sha256sum -c -
          unzip -t /tmp/ecomevo.zip
          unzip -oq /tmp/ecomevo.zip -d .
          rm -rf .payload .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import verified EcomEvo Harness"
          git push origin HEAD:main
