name: Bootstrap verified source

on:
  push:
    paths:
      - '.transfer4/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified project
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer4/block_* | base64 -d > /tmp/ecomevo.tar.xz
          echo "5f64904ceb90cf0894ac6ba01f0b8a0445d3e4ec3128601064c2faedf4529fd4  /tmp/ecomevo.tar.xz" | sha256sum -c -
          xz -t /tmp/ecomevo.tar.xz
          tar -xJf /tmp/ecomevo.tar.xz -C .
          rm -rf .transfer4 .transfer .payload .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import verified EcomEvo Harness"
          git push origin HEAD:main
