name: Evolution Patch Positive Cache Probe

on:
  pull_request:
    paths:
      - 'scripts/evolution_patch_positive_cache_probe.py'
      - '.github/workflows/evolution-patch-positive-cache-probe.yml'
      - 'ecomevo/runtime/bundled_event_store.py'
      - 'ecomevo/runtime/event_store.py'

permissions:
  contents: read

jobs:
  evolution-patch-positive-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e .
      - name: Measure evolution patch positive cache
        run: python scripts/evolution_patch_positive_cache_probe.py
