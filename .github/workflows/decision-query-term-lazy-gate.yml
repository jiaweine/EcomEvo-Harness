name: Decision Query Term Lazy Gate

on:
  pull_request:
    paths:
      - ecomevo/runtime/control_policy.py
      - tests/test_decision_query_term_lazy.py
      - scripts/decision_query_term_lazy_gate.py
      - .github/workflows/decision-query-term-lazy-gate.yml

permissions:
  contents: read

jobs:
  decision-query-term-lazy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install -e '.[dev]'
      - name: Query-term semantic boundaries
        run: python -m pytest -q tests/test_decision_query_term_lazy.py
      - name: Fixed-input production A/B
        run: python scripts/decision_query_term_lazy_gate.py
