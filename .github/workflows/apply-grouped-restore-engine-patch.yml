name: Apply Grouped Restore Engine Patch

on:
  push:
    branches:
      - perf/grouped-checkpoint-restore-stacked
    paths:
      - 'scripts/apply_grouped_restore_engine_patch.py'
      - '.github/workflows/apply-grouped-restore-engine-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/grouped-checkpoint-restore-stacked
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact Engine replacements
        run: python scripts/apply_grouped_restore_engine_patch.py
      - name: Commit Engine patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecomevo/runtime/engine.py
          git diff --cached --check
          git commit -m 'perf(runtime): route exact restores through grouped reads'
          git push origin HEAD:perf/grouped-checkpoint-restore-stacked
