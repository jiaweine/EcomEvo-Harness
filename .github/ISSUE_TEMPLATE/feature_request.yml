name: Feature request
description: Propose a product or runtime capability with explicit evidence and authority boundaries.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow failure or cost, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Verifiable outcome
      description: State how success can be observed or measured.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Evidence, authority, and side-effect boundaries
      description: Identify data sources, approval needs, failure semantics, and rollback expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
